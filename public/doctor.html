<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Konselor - UB Wellness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .table-responsive { border-radius: 10px; overflow: hidden; }
        th { font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; font-size: 0.85rem; }
        td { vertical-align: middle; }
        
        .counselor-card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: all 0.3s ease; }
        [data-bs-theme="dark"] .counselor-card { box-shadow: 0 4px 15px rgba(0,0,0,0.3); background-color: #1e293b; }
        
        /* Auto-Text Color Fix */
        [data-bs-theme="dark"] .table { color: #f8fafc !important; }
        [data-bs-theme="dark"] .table td { color: #cbd5e1 !important; }
        [data-bs-theme="dark"] .table th { color: #ffffff !important; background-color: #334155 !important; }

        .blinking-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; animation: blinker 1.5s linear infinite; margin-right: 6px; }
        @keyframes blinker { 50% { opacity: 0; } }

        .nav-pills .nav-link { color: var(--bs-body-color); border: 1px solid var(--bs-border-color); background-color: var(--bs-body-bg); padding: 12px 20px; border-radius: 10px; }
        .nav-pills .nav-link.active#sos-tab { background-color: #0d6efd; color: white; border-color: #0d6efd; }
        .nav-pills .nav-link.active#chronic-tab { background-color: #dc3545; color: white; border-color: #dc3545; }
        .nav-pills .nav-link.active#acute-tab { background-color: #f59e0b; color: white; border-color: #f59e0b; }
    </style>
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #dc3545;">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold" href="#">🏥 UB Wellness - Ruang Konselor</a>
        <div class="d-flex align-items-center gap-2">
            <span class="navbar-text text-white d-none d-md-block me-3">Login: <b>Dr. Siska</b></span>
            <button class="btn btn-sm btn-outline-light rounded-pill fw-bold" id="themeToggle">🌙 Dark Mode</button>
            <button class="btn btn-sm btn-light rounded-pill fw-bold text-danger" onclick="logout()">🚪 Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <ul class="nav nav-pills row g-2 mb-4 text-center" id="dashboardTabs" role="tablist">
        <li class="nav-item col-12 col-md-4"><button class="nav-link w-100 active fw-bold" id="sos-tab" data-bs-toggle="tab" data-bs-target="#sos-pane" type="button">🙋‍♂️ SOS Requests</button></li>
        <li class="nav-item col-12 col-md-4"><button class="nav-link w-100 fw-bold" id="chronic-tab" data-bs-toggle="tab" data-bs-target="#chronic-pane" type="button">🚨 Krisis Kronis</button></li>
        <li class="nav-item col-12 col-md-4"><button class="nav-link w-100 fw-bold" id="acute-tab" data-bs-toggle="tab" data-bs-target="#acute-pane" type="button">⚠️ Radar Anomali</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="sos-pane">
            <div class="card counselor-card">
                <div class="card-header bg-primary text-white p-3 border-0"><h5>Permintaan Bantuan Langsung</h5></div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead><tr><th>ID</th><th>Nama</th><th>Fakultas</th><th>Pesan</th><th>Waktu</th><th>Ditangani</th><th>Aksi</th></tr></thead>
                            <tbody id="requestTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="tab-pane fade" id="chronic-pane">
            <div class="card counselor-card">
                <div class="card-header bg-danger text-white p-3 border-0"><h5>[PRIORITAS] Krisis Kronis</h5></div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead><tr><th>ID</th><th>Nama</th><th>Fakultas</th><th>Domain</th><th>Skor</th><th>Tren</th><th>Aksi</th></tr></thead>
                            <tbody id="chronicTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="tab-pane fade" id="acute-pane">
            <div class="card counselor-card">
                <div class="card-header p-3 border-0" style="background-color: #f59e0b; color: white;"><h5>Radar Anomali Harian</h5></div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead><tr><th>ID</th><th>Nama</th><th>Fakultas</th><th>Domain</th><th>Skor</th><th>Tren</th><th>Aksi</th></tr></thead>
                            <tbody id="acuteTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function logout() {
        if(confirm("Yakin ingin logout?")) {
            localStorage.clear();
            window.location.href = "login.html";
        }
    }

    const themeToggleBtn = document.getElementById('themeToggle');
    const htmlElement = document.documentElement;
    const savedTheme = localStorage.getItem('doctorTheme') || 'light';
    htmlElement.setAttribute('data-bs-theme', savedTheme);
    themeToggleBtn.innerHTML = savedTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';

    themeToggleBtn.addEventListener('click', () => {
        const newTheme = htmlElement.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light';
        htmlElement.setAttribute('data-bs-theme', newTheme);
        localStorage.setItem('doctorTheme', newTheme);
        themeToggleBtn.innerHTML = newTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    });

    async function loadAlerts() {
        try {
            const response = await fetch('/api/counselor/alerts?timestamp=' + new Date().getTime());
            const result = await response.json();
            if(!result.success) return;

            const reqBody = document.getElementById('requestTableBody');
            const chronicBody = document.getElementById('chronicTableBody');
            const acuteBody = document.getElementById('acuteTableBody');
            
            reqBody.innerHTML = ''; chronicBody.innerHTML = ''; acuteBody.innerHTML = '';

            if (result.requests) {
                result.requests.forEach(s => {
                    reqBody.innerHTML += `<tr><td>#${s.intervention_id}</td><td>${s.username}</td><td>${s.fakultas}</td><td>${s.message}</td><td>${new Date(s.created_at).toLocaleTimeString()}</td><td>${s.ditangani_oleh || 'Belum'}</td><td><button class="btn btn-sm btn-primary" onclick="claimAlert('${s.username}')">Klaim</button></td></tr>`;
                });
            }
            if (result.chronic) {
                result.chronic.forEach(s => {
                    chronicBody.innerHTML += `<tr><td>#${s.id}</td><td>${s.username}</td><td>${s.fakultas}</td><td>${s.stress_domain}</td><td>${s.daily_sentiment_score}</td><td>${s.global_7day_score}</td><td><button class="btn btn-sm btn-outline-danger" onclick="sendTargetedAdvice('${s.username}')">Panggil</button></td></tr>`;
                });
            }
            if (result.acute) {
                result.acute.forEach(s => {
                    acuteBody.innerHTML += `<tr><td>#${s.id}</td><td>${s.username}</td><td>${s.fakultas}</td><td>${s.stress_domain}</td><td>${s.daily_sentiment_score}</td><td>${s.global_7day_score}</td><td><button class="btn btn-sm btn-outline-warning" onclick="sendTargetedAdvice('${s.username}')">Sapa</button></td></tr>`;
                });
            }
        } catch (e) { console.error("Error loading alerts:", e); }
    }

    async function claimAlert(username) {
        await fetch('/api/counselor/claim-alert', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username }) });
        loadAlerts();
    }
    
    async function sendTargetedAdvice(username) {
        await fetch('/api/counselor/send-advice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username }) });
        loadAlerts();
    }

    window.onload = () => { setInterval(loadAlerts, 8000); loadAlerts(); };
</script>
</body>
</html>
